<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cafetería MVC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una pizarra de menú arriba, la ruta de pasos a la izquierda como la carta, y un paso a la vez en una columna de lectura */
:root {
  --paper: #f3f5f1;
  --sheet: #ffffff;
  --ink: #1a2520;
  --ink-soft: #56645c;
  --line: #d3dcd3;
  --board: #183630;
  --board-2: #21463e;
  --board-ink: #eef4ef;
  --chalk: #f5d77a;
  --accent: #9b1d3a;
  --accent-soft: #f7e6ea;
  --ok: #2b7d00;
  --ok-bg: #e5f3dc;
  --bad: #b3261e;
  --bad-bg: #fbe6e4;
  --m: #1d5f8a; --m-bg: #e2eef6;
  --v: #9b1d3a; --v-bg: #f7e6ea;
  --c: #9a5a00; --c-bg: #f8eedc;
  --code-bg: #14201c;
  --code-ink: #e3ece6;
  --code-dim: #7f948a;
  --code-new: rgba(120, 210, 90, .16);
  --code-on: rgba(245, 215, 122, .22);
  --focus: #e08a00;
  --display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111816; --sheet: #18211e; --ink: #e5ede8; --ink-soft: #a4b4ab; --line: #2c3a35;
  --board: #0d211d; --board-2: #163028; --board-ink: #e5efe8; --chalk: #f2cf63;
  --accent: #f07b96; --accent-soft: #3a1b24; --ok: #84d65c; --ok-bg: #1a3313; --bad: #ff8f84; --bad-bg: #3c1b18;
  --m: #7fb9e3; --m-bg: #15293a; --v: #f07b96; --v-bg: #3a1b24; --c: #f0b45a; --c-bg: #3a2a12;
  --code-bg: #0b1311; --code-ink: #e3ece6; --code-dim: #75897f; --focus: #f2a33a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111816; --sheet: #18211e; --ink: #e5ede8; --ink-soft: #a4b4ab; --line: #2c3a35;
  --board: #0d211d; --board-2: #163028; --board-ink: #e5efe8; --chalk: #f2cf63;
  --accent: #f07b96; --accent-soft: #3a1b24; --ok: #84d65c; --ok-bg: #1a3313; --bad: #ff8f84; --bad-bg: #3c1b18;
  --m: #7fb9e3; --m-bg: #15293a; --v: #f07b96; --v-bg: #3a1b24; --c: #f0b45a; --c-bg: #3a2a12;
  --code-bg: #0b1311; --code-ink: #e3ece6; --code-dim: #75897f; --focus: #f2a33a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
code, kbd { font-family: var(--mono); font-size: .86em; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; overflow-wrap: anywhere; }
a { color: var(--m); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- pizarra ---------- */
.board { background: var(--board); color: var(--board-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.board-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: .01em; }
.brand h1 span { color: var(--chalk); }
.brand small { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; opacity: .78; }
.meter { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 220px; flex: 0 1 340px; }
.meter-bar { flex: 1; height: 8px; background: var(--board-2); border-radius: 8px; overflow: hidden; }
.meter-bar i { display: block; height: 100%; width: 0; background: var(--chalk); transition: width .4s ease; }
.meter b { font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; }

/* ---------- estructura ---------- */
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.route { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
.route h2 { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--body); margin: 0 0 8px 10px; }
.route ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ritem { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; text-align: left;
  border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.ritem:hover:not(:disabled) { background: var(--sheet); }
.ritem[aria-current="page"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--accent); }
.ritem:disabled { cursor: not-allowed; opacity: .5; }
.rnum { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; border: 1.5px solid var(--line); font-variant-numeric: tabular-nums; }
.ritem.done .rnum { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rtxt { font-size: .92rem; line-height: 1.25; }
.route-mobile { display: none; }

.letter { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px; font-size: .72rem; font-weight: 700; font-family: var(--mono); }
.letter.M { background: var(--m-bg); color: var(--m); }
.letter.V { background: var(--v-bg); color: var(--v); }
.letter.C { background: var(--c-bg); color: var(--c); }

main { min-width: 0; }
.view { max-width: 820px; display: grid; gap: 28px; }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.view > header h2 { font-size: clamp(1.7rem, 3.2vw, 2.35rem); font-weight: 800; margin-top: 6px; }
.goal { margin-top: 12px; font-size: 1.08rem; }
.goal b { color: var(--accent); }

section.block { display: grid; gap: 12px; }
section.block > h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
section.block > h3 .tag { font-family: var(--body); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.prose p { margin: 0 0 10px; max-width: 68ch; }
.analogy { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; max-width: 68ch; }
.analogy b { color: var(--accent); }

ol.actions { list-style: none; counter-reset: a; margin: 0; padding: 0; display: grid; gap: 18px; }
ol.actions > li { counter-increment: a; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
ol.actions > li::before { content: counter(a); width: 30px; height: 30px; border-radius: 50%; background: var(--board); color: var(--board-ink); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.act { min-width: 0; display: grid; gap: 12px; }
.act > p { margin: 3px 0 0; }

/* ---------- tablas ---------- */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
.tbl table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- código ---------- */
.code { border-radius: 12px; overflow: hidden; background: var(--code-bg); color: var(--code-ink); }
.code-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: #0000002e; border-bottom: 1px solid #ffffff14; }
.code-head .fname { font-family: var(--mono); font-weight: 600; font-size: .9rem; }
.code-head .fpath { font-family: var(--mono); font-size: .74rem; color: var(--code-dim); overflow-wrap: anywhere; flex-basis: 100%; order: 5; }
.mode { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: #ffffff1a; }
.mode.crear { background: #78d25a33; color: #b9f09d; }
.mode.reemplazar { background: #f5d77a33; color: #f5d77a; }
.copy { margin-left: auto; border: 1px solid #ffffff33; background: transparent; color: var(--code-ink); border-radius: 6px; padding: 3px 10px; font-size: .8rem; cursor: pointer; }
.copy:hover { background: #ffffff14; }
.code pre { margin: 0; padding: 10px 0; overflow-x: auto; font-family: var(--mono); font-size: .82rem; line-height: 1.6; tab-size: 4; }
.ln { display: grid; grid-template-columns: 44px minmax(max-content, 1fr); }
.ln .no { text-align: right; padding-right: 12px; color: var(--code-dim); user-select: none; font-variant-numeric: tabular-nums; position: relative; }
.ln .tx { padding-right: 16px; white-space: pre; }
.ln.new { background: var(--code-new); }
.ln.new .no { color: #9fe07f; }
.ln.on { background: var(--code-on); }
.ln .pin { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; border-radius: 50%; background: var(--chalk); color: #2a2205; font-size: .6rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.code .legend { font-size: .76rem; color: var(--code-dim); padding: 0 12px 10px; display: flex; gap: 14px; flex-wrap: wrap; }
.code .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--code-new); outline: 1px solid #9fe07f66; margin-right: 6px; vertical-align: -1px; }
.t-com { color: #7f948a; font-style: italic; } .t-str { color: #f2c27b; } .t-ann { color: #f5d77a; font-weight: 600; } .t-kw { color: #f08aa5; }
.t-typ { color: #8cc8ef; } .t-num { color: #c3a6ff; } .t-tag { color: #f08aa5; } .t-th { color: #9fe07f; font-weight: 600; } .t-attr { color: #8cc8ef; }
.t-sel { color: #f08aa5; } .t-prop { color: #8cc8ef; } .t-var { color: #9fe07f; } .t-cmd { color: #9fe07f; font-weight: 600; }

.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); padding: 6px; }
.notes > li > button { width: 100%; text-align: left; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; border: 0; background: transparent; padding: 8px; border-radius: 6px; cursor: pointer; font-size: .93rem; }
.notes > li > button:hover, .notes > li > button.on { background: var(--paper); }
.notes .pinx { width: 20px; height: 20px; border-radius: 50%; background: var(--chalk); color: #2a2205; font-size: .7rem; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.notes-title { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin: 2px 0 -4px; }

/* ---------- navegador simulado ---------- */
.browser { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--sheet); box-shadow: 0 8px 24px #0000000f; }
.bbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.url { flex: 1; min-width: 0; font-family: var(--mono); font-size: .8rem; background: var(--sheet); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btabs { display: flex; gap: 6px; flex-wrap: wrap; }
.btabs button { border: 1px solid var(--line); background: var(--sheet); border-radius: 20px; padding: 3px 10px; font-family: var(--mono); font-size: .74rem; cursor: pointer; }
.btabs button[aria-pressed="true"] { background: var(--board); color: var(--board-ink); border-color: var(--board); }
.bview { min-height: 140px; max-height: 460px; overflow: auto; }
.bnote { font-size: .92rem; color: var(--ink-soft); margin: 0; }
.json { margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: .82rem; line-height: 1.55; white-space: pre; overflow-x: auto; color: var(--ink); background: var(--sheet); }
.json .k { color: var(--m); } .json .s { color: var(--accent); } .json .n { color: var(--ok); }

/* ---------- comprobación y pregunta ---------- */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.checks label:has(input:checked) { border-color: var(--ok); background: var(--ok-bg); }
.quiz { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.quiz p.q { margin: 0; font-weight: 700; font-size: 1.05rem; }
.ops { display: grid; gap: 8px; }
.ops button { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.ops button:hover:not(:disabled) { border-color: var(--ink-soft); }
.ops button.right { border-color: var(--ok); background: var(--ok-bg); font-weight: 700; }
.ops button.wrong { border-color: var(--bad); background: var(--bad-bg); }
.ops button:disabled { cursor: default; }
.fb { border-radius: 10px; padding: 10px 14px; margin: 0; }
.fb.ok { background: var(--ok-bg); } .fb.no { background: var(--bad-bg); }
details.err { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
details.err summary { cursor: pointer; padding: 10px 14px; font-weight: 700; }
details.err div { padding: 0 14px 12px 14px; }
details.err + details.err { margin-top: -4px; }

.stepnav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.btn { border: 1.5px solid var(--board); background: transparent; color: var(--ink); border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--board); color: var(--board-ink); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: var(--line); }
.pending { font-size: .9rem; color: var(--ink-soft); }
.stepnav .grow { flex: 1; }

/* ---------- recorrido ---------- */
.sim { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.node { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 8px; text-align: center; font-size: .84rem; transition: transform .25s, border-color .25s, background .25s; min-width: 0; overflow-wrap: anywhere; }
.node b { display: block; font-family: var(--mono); font-size: .78rem; margin-top: 4px; }
.node.on { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }
.stage { display: grid; gap: 6px; min-height: 92px; }
.stage p { margin: 0; }
.cargo { display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: .8rem; background: var(--paper); border: 1px dashed var(--ink-soft); border-radius: 8px; padding: 4px 10px; justify-self: start; }
.simnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pips { display: flex; gap: 5px; margin-left: auto; } .pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); } .pips i.on { background: var(--accent); }

/* ---------- inicio y cierre ---------- */
.hero { display: grid; gap: 14px; }
.hero h2 { font-size: clamp(2rem, 4.4vw, 3rem); font-weight: 800; }
.hero p { margin: 0; font-size: 1.1rem; max-width: 62ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card code { justify-self: start; }
.card p { margin: 0; font-size: .94rem; color: var(--ink-soft); }
.files { display: grid; gap: 6px; }
.file { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.file span.d { color: var(--ink-soft); font-size: .9rem; }
.file small { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 6px; max-width: 420px; }
.field input { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--sheet); color: var(--ink); }
.cert { border: 2px solid var(--board); border-radius: 16px; background: var(--sheet); padding: 24px; display: grid; gap: 10px; text-align: center; position: relative; overflow: hidden; }
.cert::before { content: ""; position: absolute; inset: 0 0 auto; height: 10px; background: repeating-linear-gradient(90deg, var(--accent) 0 24px, var(--chalk) 24px 48px, var(--board) 48px 72px); }
.cert h3 { font-size: 1.9rem; font-weight: 800; margin-top: 8px; }
.cert .who { font-family: var(--display); font-size: 1.6rem; color: var(--accent); }
.cert .meta { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: .92rem; }
.cert .code-v { font-family: var(--mono); font-weight: 600; letter-spacing: .08em; }
.locked { background: var(--sheet); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; color: var(--ink-soft); }
.retos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.reto { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.reto p { margin: 0; }
.reto button { justify-self: start; border: 0; background: none; color: var(--m); text-decoration: underline; cursor: pointer; padding: 0; font-size: .9rem; }
.reto .hint { color: var(--ink-soft); font-size: .92rem; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- glosario ---------- */
.term { border: 0; background: none; padding: 0; color: inherit; border-bottom: 2px dotted var(--accent); cursor: help; font: inherit; }
.pop { position: absolute; z-index: 20; max-width: 300px; background: var(--board); color: var(--board-ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; box-shadow: 0 10px 30px #00000040; }
.pop b { color: var(--chalk); display: block; margin-bottom: 2px; }

@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 48px; }
  .route { display: none; }
  .route-mobile { display: grid; gap: 4px; margin-bottom: 20px; }
  .route-mobile select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); }
  .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .meter { flex-basis: 100%; margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="board">
  <div class="board-in">
    <div class="brand">
      <h1>Cafetería <span>MVC</span></h1>
      <small>Ruta guiada · Ejemplo 2 de 3 · ADSO 3230489</small>
    </div>
    <div class="meter" aria-label="Progreso">
      <div class="meter-bar"><i id="meterFill"></i></div>
      <b id="meterTxt">0 de 13 pasos</b>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="route" aria-label="Ruta de pasos">
    <h2>La ruta</h2>
    <ol id="routeList"></ol>
  </nav>
  <main>
    <div class="route-mobile"><label for="routeSelect" class="pending">Ir a</label><select id="routeSelect"></select></div>
    <div id="app"></div>

<script>
const DATA = {"pasos":[{"id":"paso-0","corto":"Preparar el entorno","letra":"","titulo":"Preparar el entorno","meta":"Verificar que la máquina virtual tiene todo lo necesario antes de empezar.","minutos":10,"entienda":["Para construir la cafetería necesita tres herramientas: **Java 21** (el lenguaje), **Visual Studio Code** con las extensiones de Java y Spring (el editor) y una **terminal** (para dar órdenes al sistema).","Son las mismas que usó en Rincones de Cartagena. Si ese ejemplo le funcionó, este paso es solo una verificación."],"acciones":[{"t":"Abra una terminal en Ubuntu (`Ctrl + Alt + T`) y ejecute estas órdenes una por una:","code":{"archivo":"Terminal","lang":"sh","modo":"terminal","code":"java -version          # debe mostrar la versión 21\nmkdir -p ~/spring-labs   # crea la carpeta de laboratorios (si no existe)\ncd ~/spring-labs\ncode .                 # abre VS Code en esa carpeta","notas":[{"t":"Pregunta qué versión de Java está instalada. Debe aparecer `21`.","line":0},{"t":"`mkdir` crea una carpeta. `-p` evita el error si ya existe.","line":1},{"t":"Abre VS Code. El punto significa «la carpeta donde estoy».","line":3}]}},{"t":"En VS Code, abra el panel de extensiones (`Ctrl + Shift + X`) y confirme que están instaladas **Extension Pack for Java** y **Spring Boot Extension Pack**."}],"compruebe":["`java -version` muestra la versión 21.","VS Code se abrió en la carpeta `spring-labs`.","Las dos extensiones aparecen como instaladas."],"pregunta":{"q":"¿Para qué sirve la orden `cd ~/spring-labs`?","ops":["Crea la carpeta spring-labs","Entra a la carpeta spring-labs","Abre VS Code","Instala Java"],"ok":1,"exp":"`cd` significa *change directory*: lo mueve a esa carpeta. La que la crea es `mkdir`."},"errores":[{"s":"`java: command not found` o aparece una versión distinta de 21","f":"Avise a su instructor: hay que instalar o seleccionar el JDK 21 en la máquina virtual."},{"s":"`code: command not found`","f":"Abra VS Code desde el menú de aplicaciones y use **File → Open Folder** para abrir `spring-labs`."}]},{"id":"paso-1","corto":"Crear el proyecto","letra":"","titulo":"Crear el proyecto y verlo arrancar","meta":"Generar un proyecto Spring Boot vacío llamado `cafeteria` y comprobar que el servidor responde.","minutos":20,"entienda":["**Spring Initializr** arma la estructura de un proyecto Spring Boot. Usted elige las [[dependencia|dependencias]], las piezas que le agregan capacidades:","**Spring Web** permite atender peticiones del navegador. **Thymeleaf** permite construir páginas con datos. **Spring Boot DevTools** reinicia la aplicación sola cada vez que usted guarda un cambio."],"acciones":[{"t":"En VS Code presione `Ctrl + Shift + P`, escriba **Spring Initializr: Create a Maven Project…** y responda así:","tabla":{"head":["Pregunta","Respuesta","Por qué"],"rows":[["Spring Boot version","La estable que aparezca primero","Evite las que dicen SNAPSHOT o M"],["Language","Java",""],["Group Id","`co.edu.sena.adso`","Identifica a la organización"],["Artifact Id","`cafeteria`","Nombre del proyecto. Escríbalo exactamente así"],["Packaging / Java","Jar / 21","Jar trae su propio servidor"],["Dependencias","**Spring Web**, **Thymeleaf**, **Spring Boot DevTools**","Selecciónelas con la barra espaciadora y presione Enter"],["Carpeta","`spring-labs`","Donde guarda sus laboratorios"]]}},{"t":"Cuando VS Code pregunte, abra el proyecto nuevo. Luego abra `src/main/resources/application.properties` y reemplace todo su contenido por:","code":{"archivo":"application.properties","ruta":"src/main/resources/","lang":"props","modo":"reemplazar","code":"spring.application.name=cafeteria\nspring.thymeleaf.cache=false\nserver.error.include-message=always","notas":[{"t":"El nombre de la aplicación. Aparece en la consola al arrancar.","line":0},{"t":"Con `false`, las vistas se releen en cada visita: verá sus cambios con solo recargar el navegador.","line":1},{"t":"Las páginas de error mostrarán el mensaje del error. Muy útil mientras aprende.","line":2}]}},{"t":"Ejecute la aplicación con el botón ▶ del panel **Spring Boot Dashboard** o en la terminal de VS Code (`Ctrl + ñ`):","code":{"archivo":"Terminal (dentro de la carpeta cafeteria)","lang":"sh","modo":"terminal","code":"./mvnw spring-boot:run"}},{"t":"Abra el navegador en `http://localhost:8080/menu`."}],"ver":{"url":"localhost:8080/menu","tipo":"whitelabel","status":404,"error":"Not Found","msg":"No static resource menu.","nota":"Este error es una buena señal: el servidor está vivo y respondió. Responde 404 («no encontrado») porque todavía no existe nada en `/menu`."},"compruebe":["En la consola aparece `Tomcat started on port 8080`.","En `localhost:8080/menu` aparece la **Whitelabel Error Page** con el código 404."],"pregunta":{"q":"Usted no ha escrito ningún código y el navegador recibió una respuesta 404. ¿Quién respondió?","ops":["Nadie: el navegador inventó el error","El servidor Tomcat que trae Spring Boot","PostgreSQL","VS Code"],"ok":1,"exp":"Spring Boot trae un servidor (Tomcat) que escucha en el puerto 8080. Respondió 404 porque no hay ningún [[endpoint]] `/menu`… todavía."},"errores":[{"s":"`Port 8080 was already in use`","f":"Hay otra aplicación corriendo (quizás Rincones de Cartagena). Deténgala con `Ctrl + C` en su terminal o con el botón ■ del Dashboard."},{"s":"`./mvnw: Permission denied`","f":"Ejecute `chmod +x mvnw` una vez y vuelva a intentarlo."},{"s":"El navegador dice «No se puede acceder a este sitio»","f":"La aplicación no está corriendo o se detuvo por un error. Mire la consola y busque la primera línea con `ERROR`."}]},{"id":"paso-2","corto":"Carpetas M, V y C","letra":"","titulo":"Preparar las carpetas de M, V y C","meta":"Crear un lugar para cada parte del patrón [[MVC]].","minutos":10,"entienda":["En Rincones de Cartagena todos los archivos Java estaban juntos. Ahora la aplicación tiene más piezas, así que las ordenamos: cada letra del patrón MVC tiene su propia carpeta.","En Java, las carpetas dentro de `src/main/java` se llaman [[paquete|paquetes]]. **Spring solo encuentra las clases que están dentro del paquete principal** (`co.edu.sena.adso.cafeteria`) o en sus subcarpetas. Por eso las tres carpetas nuevas van **dentro** de `cafeteria`."],"acciones":[{"t":"En el explorador de VS Code, despliegue `src/main/java/co/edu/sena/adso/cafeteria`. Allí está `CafeteriaApplication.java`."},{"t":"Clic derecho sobre la carpeta `cafeteria` → **New Folder**. Cree tres carpetas: `model`, `service` y `controller`."},{"t":"Compare con la estructura completa que tendrá al terminar. Los archivos aún no existen: los creará en los próximos pasos.","code":{"archivo":"Estructura final del proyecto","lang":"tree","modo":"ref","code":"cafeteria/\n└── src/main/\n    ├── java/co/edu/sena/adso/cafeteria/\n    │   ├── CafeteriaApplication.java    ← ya existe: enciende la aplicación\n    │   ├── model/\n    │   │   └── Plato.java                M  paso 3\n    │   ├── service/\n    │   │   └── MenuService.java          M  paso 4\n    │   └── controller/\n    │       ├── MenuController.java       C  paso 5\n    │       └── MenuApiController.java    C  paso 12\n    └── resources/\n        ├── application.properties\n        ├── static/css/\n        │   └── cafeteria.css                paso 7\n        └── templates/\n            ├── menu.html                 V  paso 6\n            └── plato.html                V  paso 9"}}],"compruebe":["Las carpetas `model`, `service` y `controller` están **dentro** de `cafeteria`, al mismo nivel que `CafeteriaApplication.java`."],"pregunta":{"q":"Si crea la carpeta `service` directamente dentro de `src/main/java` (fuera de `cafeteria`), ¿qué pasará?","ops":["Nada, Spring busca en todo el proyecto","Spring no encontrará las clases de esa carpeta","El proyecto se borra","Funcionará más rápido"],"ok":1,"exp":"Spring revisa el paquete donde está `CafeteriaApplication` y sus subcarpetas. Lo que quede afuera, no existe para Spring."},"errores":[{"s":"VS Code creó `cafeteria.model` como una sola carpeta con punto","f":"Es lo mismo: VS Code a veces muestra los paquetes compactados. Lo importante es que el paquete sea `co.edu.sena.adso.cafeteria.model`."}]},{"id":"paso-3","corto":"Modelo: Plato","letra":"M","titulo":"El Modelo: los datos de un plato","meta":"Decirle a Java qué información tiene un plato del menú.","minutos":10,"entienda":["El **Modelo** representa los datos del negocio. En la cafetería, cada plato tiene un **código**, un **nombre**, un **tipo** (desayuno, almuerzo o bebida) y un **precio** en pesos.","Usamos un [[record]], igual que `Lugar` en Rincones de Cartagena: la forma más corta en Java de declarar una clase que solo guarda datos. Java crea solo los métodos `id()`, `nombre()`, `tipo()` y `precio()`."],"analogia":"El record es como el formato de una ficha en blanco: dice qué casillas tiene cada plato, pero todavía no hay ningún plato escrito.","acciones":[{"t":"Clic derecho sobre la carpeta `model` → **New Java File** → **Record**. Escriba el nombre `Plato`."},{"t":"Deje el archivo exactamente así:","code":{"archivo":"Plato.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/model/","letra":"M","lang":"java","modo":"crear","code":"package co.edu.sena.adso.cafeteria.model;\n\n// MODELO: los datos de un plato del menú\npublic record Plato(Long id, String nombre, String tipo, int precio) {\n}","notas":[{"t":"Dice en qué paquete (carpeta) vive la clase. VS Code lo escribe solo.","line":0},{"t":"Declara un tipo de dato nuevo llamado `Plato`.","line":3},{"t":"Los cuatro datos de cada plato. `Long` y `int` son números; `String` es texto.","line":3}]}}],"compruebe":["El archivo no muestra errores en rojo.","Está dentro de la carpeta `model`."],"pregunta":{"q":"¿Qué sabe la clase `Plato` sobre páginas web o el navegador?","ops":["Todo: arma la página","Nada: solo conoce los datos de un plato","Sabe qué URL lo llamó","Conoce el HTML del menú"],"ok":1,"exp":"Así debe ser. El Modelo solo conoce los datos. Del navegador se encarga el Controlador y del HTML, la Vista."},"errores":[{"s":"No aparece la opción **Record** al crear el archivo","f":"Cree una clase normal (**Class**) llamada `Plato` y reemplace todo su contenido por el código de arriba."},{"s":"Sale en rojo la línea `package`","f":"El archivo quedó en otra carpeta. Muévalo a `model` o corrija la línea para que coincida con su carpeta."}]},{"id":"paso-4","corto":"Modelo: MenuService","letra":"M","titulo":"El Modelo: el servicio con los platos","meta":"Tener en un solo lugar la lista de platos y las reglas para consultarlos.","minutos":20,"entienda":["El **servicio** también es parte del Modelo. Guarda los datos (por ahora en una lista; en Dulces Doña Ana estarán en PostgreSQL) y tiene las **reglas** para consultarlos: dar todos, filtrar por tipo y buscar uno por su código.","La anotación `@Service` le dice a Spring: «crea un objeto de esta clase al arrancar y entrégaselo a quien lo pida». A ese objeto se le llama [[bean]]."],"analogia":"El servicio es la cocina: tiene los platos y sabe prepararlos. El mesero (el controlador) no cocina, le pide a la cocina.","acciones":[{"t":"Clic derecho sobre la carpeta `service` → **New Java File** → **Class**, nombre `MenuService`."},{"t":"Escriba el servicio completo:","code":{"archivo":"MenuService.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/service/","letra":"M","lang":"java","modo":"crear","code":"package co.edu.sena.adso.cafeteria.service;\n\nimport java.util.List;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.server.ResponseStatusException;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\n\n@Service   // MODELO (lógica): guarda los datos y sabe buscarlos\npublic class MenuService {\n\n    private final List\u003cPlato> platos = List.of(\n            new Plato(1L, \"Arepa de huevo\", \"desayuno\", 4000),\n            new Plato(2L, \"Arroz con pollo\", \"almuerzo\", 12000),\n            new Plato(3L, \"Mojarra frita con patacón\", \"almuerzo\", 18000),\n            new Plato(4L, \"Jugo de corozo\", \"bebida\", 3000),\n            new Plato(5L, \"Limonada de coco\", \"bebida\", 5000));\n\n    public List\u003cPlato> todos() {\n        return platos;\n    }\n\n    public List\u003cPlato> porTipo(String tipo) {\n        return platos.stream()\n                .filter(p -> p.tipo().equalsIgnoreCase(tipo))\n                .toList();\n    }\n\n    public Plato buscar(Long id) {\n        return platos.stream()\n                .filter(p -> p.id().equals(id))\n                .findFirst()\n                .orElseThrow(() -> new ResponseStatusException(\n                        HttpStatus.NOT_FOUND, \"No existe el plato \" + id));\n    }\n}","notas":[{"t":"Spring crea un objeto de esta clase al arrancar y lo administra.","line":10},{"t":"La lista de los cinco platos. `List.of` crea una lista que no se puede modificar.","line":13},{"t":"`1L` es el número 1 de tipo `Long`. El orden de los datos es el mismo del record: id, nombre, tipo, precio.","line":14},{"t":"Regla 1: devolver todos los platos.","line":20},{"t":"Regla 2: devolver solo los platos de un tipo.","line":24},{"t":"Recorre la lista con un [[stream]] y se queda con los platos cuyo tipo sea igual al pedido, sin importar mayúsculas.","line":26},{"t":"Regla 3: buscar un plato por su código.","line":30},{"t":"Se queda con el primero que cumpla la condición… si existe.","line":33},{"t":"Si no existe, lanza un error **404** con el mensaje «No existe el plato…». Lo verá funcionar en el paso 9.","line":34}]}}],"compruebe":["El archivo no tiene palabras en rojo.","Puede señalar los tres métodos (reglas) del servicio: `todos`, `porTipo` y `buscar`."],"pregunta":{"q":"¿Por qué la lista de platos está en el servicio y no en el controlador?","ops":["Porque el controlador no puede tener listas","Para que las reglas estén en un solo lugar y cualquier controlador las reutilice","Porque Spring lo exige siempre","Para que la página cargue más rápido"],"ok":1,"exp":"En el paso 12 un segundo controlador (la API) usará **el mismo servicio** sin repetir nada. Y cuando los datos pasen a PostgreSQL, solo cambiará el servicio."},"errores":[{"s":"Palabras en rojo como `List`, `HttpStatus` o `ResponseStatusException`","f":"Falta el `import`. Ponga el cursor sobre la palabra, presione `Ctrl + .` y elija **Import…**. O copie los `import` del código de arriba."},{"s":"Sale en rojo `Plato`","f":"Falta `import co.edu.sena.adso.cafeteria.model.Plato;` o el record del paso 3 tiene otro nombre."}]},{"id":"paso-5","corto":"Controlador","letra":"C","titulo":"El Controlador: el endpoint GET /menu","meta":"Crear el [[endpoint]] `GET /menu`, que le pide los platos al servicio y elige la vista.","minutos":20,"entienda":["El **Controlador** recibe la petición, le pide los datos al Modelo, los pone en la bandeja ([[Model]]) y elige qué **vista** mostrar. Es lo mismo que hizo `InicioController` en Rincones de Cartagena.","La novedad es la [[inyección de dependencias]]: el controlador **no fabrica** el servicio con `new MenuService()`. Lo pide en su constructor y Spring se lo entrega (el bean del paso 4)."],"analogia":"El controlador es el mesero: toma el pedido (la petición), lo pasa a la cocina (el servicio), sirve el plato en la bandeja (el Model) y lo lleva a la mesa indicada (la vista).","acciones":[{"t":"Clic derecho sobre la carpeta `controller` → **New Java File** → **Class**, nombre `MenuController`."},{"t":"Escriba el controlador:","code":{"archivo":"MenuController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"crear","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\n\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller   // CONTROLADOR: recibe la petición y elige la vista\npublic class MenuController {\n\n    private final MenuService menu;\n\n    public MenuController(MenuService menu) {   // Spring entrega el servicio\n        this.menu = menu;\n    }\n\n    // GET /menu\n    @GetMapping(\"/menu\")\n    public String verMenu(Model model) {\n        model.addAttribute(\"titulo\", \"Menú del día\");\n        model.addAttribute(\"platos\", menu.todos());\n        return \"menu\";             // VISTA: templates/menu.html\n    }\n}","notas":[{"t":"«Esta clase es un controlador que responde con páginas».","line":8},{"t":"El controlador necesita el servicio y lo guarda aquí. `final`: una vez asignado, no cambia.","line":11},{"t":"El constructor. Spring lo llama al arrancar y le **entrega** el servicio: eso es la inyección de dependencias.","line":13},{"t":"Este método atiende el endpoint **GET /menu**.","line":18},{"t":"La bandeja donde se ponen los datos para la vista.","line":19},{"t":"Le pide los platos a la cocina (el servicio) y los pone en la bandeja con el nombre `platos`.","line":21},{"t":"El **nombre** de la vista. Spring buscará `templates/menu.html`.","line":22}]}},{"t":"Guarde. Si la aplicación estaba corriendo, DevTools la reinicia sola. Recargue `localhost:8080/menu`."}],"ver":{"url":"localhost:8080/menu","tipo":"whitelabel","status":500,"error":"Internal Server Error","msg":"Error resolving template [menu], template might not exist or might not be accessible by any of the configured Template Resolvers","nota":"Otro error, ¡pero distinto! Ya no es 404: el controlador sí atendió `/menu`. Ahora falla porque busca la vista `menu` y todavía no existe. La creamos en el paso 6."},"compruebe":["El error cambió de 404 a 500 y menciona `Error resolving template [menu]`.","Puede explicar por qué el controlador recibe el servicio en el constructor."],"pregunta":{"q":"¿Qué significa `return \"menu\";` en un método con `@Controller`?","ops":["Muestra la palabra «menu» en el navegador","Devuelve el nombre de la vista: templates/menu.html","Redirige a la URL /menu","Devuelve la lista de platos"],"ok":1,"exp":"Con `@Controller`, el texto que se devuelve es el **nombre de una vista**. Spring le agrega `templates/` y `.html` y busca ese archivo."},"errores":[{"s":"Sigue saliendo 404 en `/menu`","f":"Revise que la clase tenga `@Controller`, que esté dentro de la carpeta `controller` y que la ruta sea exactamente `@GetMapping(\"/menu\")`. Reinicie la aplicación."},{"s":"`Parameter 0 of constructor in MenuController required a bean of type MenuService`","f":"Spring no encontró el servicio: falta `@Service` en `MenuService` o quedó fuera del paquete principal."}]},{"id":"paso-6","corto":"Vista: menu.html","letra":"V","titulo":"La Vista: la página del menú","meta":"Crear la plantilla que muestra los platos que envió el controlador.","minutos":20,"entienda":["La **Vista** es una página HTML con atributos de [[Thymeleaf]] (los que empiezan por `th:`). Ya los conoce: `th:text` reemplaza un texto y `th:each` repite una etiqueta por cada elemento de una lista.","Lo nuevo es `#numbers.formatInteger`, que le da formato al precio: `12000` se muestra como `12.000`."],"acciones":[{"t":"Clic derecho sobre `src/main/resources/templates` → **New File** → `menu.html`. El nombre debe coincidir con el `return \"menu\"` del controlador."},{"t":"Escriba la vista:","code":{"archivo":"menu.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"crear","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle th:text=\"${titulo}\">Menú\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1 th:text=\"${titulo}\">Título\u003c/h1>\n\n  \u003cul>\n    \u003cli th:each=\"p : ${platos}\">\n      \u003cspan th:text=\"${p.nombre}\">Plato\u003c/span>\n      · $ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\n    \u003c/li>\n  \u003c/ul>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Activa los atributos `th:` en la página.","line":1},{"t":"Reemplaza «Título» por el dato `titulo` de la bandeja: «Menú del día».","line":7},{"t":"Repite el `\u003cli>` una vez por cada plato de la lista `platos`. En cada vuelta, el plato se llama `p`.","line":10},{"t":"El nombre del plato de esa vuelta.","line":11},{"t":"Formatea el precio: mínimo 1 dígito y punto como separador de miles.","line":12}]}},{"t":"Guarde y recargue `localhost:8080/menu`."}],"ver":{"url":"localhost:8080/menu","tipo":"menu","estilo":false,"detalle":false,"filtros":false,"nota":"Funciona, aunque se ve sencilla. En el siguiente paso le pondrá los colores de la cafetería."},"compruebe":["Aparece «Menú del día» y los cinco platos con su precio.","Los precios tienen punto de miles: `12.000`, `18.000`.","Con `Ctrl + U` (ver código fuente) no queda ningún atributo `th:`."],"pregunta":{"q":"En `th:each=\"p : ${platos}\"`, ¿de dónde sale el nombre `platos`?","ops":["Del nombre del archivo menu.html","Del model.addAttribute(\"platos\", …) del controlador","Del record Plato","Lo inventa Thymeleaf"],"ok":1,"exp":"Los nombres de la vista deben coincidir con los que el controlador puso en la bandeja. Si escribe otro nombre, la lista llega vacía."},"errores":[{"s":"Sigue el error `Error resolving template [menu]`","f":"El archivo debe llamarse `menu.html` (minúsculas) y estar en `src/main/resources/templates`, no en `static`."},{"s":"Aparecen «Título», «Plato» y «0»","f":"Abrió el archivo con doble clic. Ábralo siempre desde `http://localhost:8080/menu`."},{"s":"Aparece el título pero ningún plato","f":"El nombre en `th:each` no coincide con el de `addAttribute`. Deben ser los dos `platos`."}]},{"id":"paso-7","corto":"Estilos CSS","letra":"V","titulo":"Dele estilo a la cafetería","meta":"Crear una hoja de estilos y conectarla a la vista.","minutos":15,"entienda":["Como en Rincones de Cartagena, la hoja de estilos es un **archivo fijo**: va en la carpeta `static` y Spring Boot la entrega tal cual.","Esta vez los estilos usan **nombres de etiquetas** (`h1`, `li`, `p a`) en lugar de clases. Así no hay que cambiar el HTML: cada `\u003cli>` del menú se convierte en una tarjeta."],"acciones":[{"t":"Dentro de `src/main/resources/static` cree la carpeta `css` y, dentro de ella, el archivo `cafeteria.css`:","code":{"archivo":"cafeteria.css","ruta":"src/main/resources/static/css/","lang":"css","modo":"crear","code":"/* Estilos de la cafetería: colores del Caribe */\n:root {\n  --mar: #0b4f6c;\n  --corozo: #9b1d3a;\n  --coco: #fff8ec;\n  --texto: #2b2b2b;\n}\n\nbody {\n  max-width: 720px;\n  margin: 0 auto;\n  padding: 24px 16px;\n  font-family: Arial, Helvetica, sans-serif;\n  background: var(--coco);\n  color: var(--texto);\n}\n\nh1 {\n  color: var(--mar);\n  border-bottom: 4px solid var(--corozo);\n  padding-bottom: 8px;\n}\n\na {\n  color: var(--mar);\n  font-weight: bold;\n}\n\n/* Los enlaces de filtro (están dentro de un párrafo) */\np a {\n  display: inline-block;\n  background: var(--mar);\n  color: white;\n  padding: 4px 12px;\n  border-radius: 16px;\n  text-decoration: none;\n}\n\nul {\n  list-style: none;\n  padding: 0;\n}\n\n/* Cada plato del menú */\nli {\n  background: white;\n  margin-bottom: 10px;\n  padding: 12px 16px;\n  border-left: 6px solid var(--corozo);\n  border-radius: 8px;\n  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);\n}","notas":[{"t":"Define los colores una sola vez, con nombre. Se usan con `var(--mar)`.","line":1},{"t":"El contenido no pasa de 720 píxeles de ancho y `margin: 0 auto` lo centra.","line":9},{"t":"Solo los enlaces que estén **dentro de un párrafo**. Los usará en el paso 11 para los botones de filtro.","line":29},{"t":"Quita las viñetas de la lista.","line":39},{"t":"Cada plato: fondo blanco, borde color corozo a la izquierda, esquinas redondeadas y sombra.","line":44}]}},{"t":"En `menu.html`, agregue la línea del CSS dentro de `\u003chead>`, debajo de `\u003ctitle>`. Así queda el archivo completo:","code":{"archivo":"menu.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"reemplazar","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle th:text=\"${titulo}\">Menú\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1 th:text=\"${titulo}\">Título\u003c/h1>\n\n  \u003cul>\n    \u003cli th:each=\"p : ${platos}\">\n      \u003cspan th:text=\"${p.nombre}\">Plato\u003c/span>\n      · $ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\n    \u003c/li>\n  \u003c/ul>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Conecta la hoja de estilos. La ruta empieza en la carpeta `static`: `static/css/cafeteria.css` → `/css/cafeteria.css`.","line":5}],"nuevo":[5]}},{"t":"Guarde y recargue `localhost:8080/menu`. Si no cambia, reinicie la aplicación: los archivos nuevos de `static` a veces lo necesitan."}],"ver":{"url":"localhost:8080/menu","tipo":"menu","estilo":true,"detalle":false,"filtros":false},"compruebe":["El título es azul con una línea color corozo debajo.","Cada plato aparece como una tarjeta blanca.","`localhost:8080/css/cafeteria.css` muestra el texto del CSS."],"pregunta":{"q":"¿Por qué `cafeteria.css` va en `static` y `menu.html` va en `templates`?","ops":["Es indiferente, pueden ir en cualquiera","El CSS se entrega tal cual; la vista se llena con datos antes de enviarse","Porque el CSS es más pesado","Porque templates solo acepta archivos HTML"],"ok":1,"exp":"`static` guarda archivos fijos que se entregan sin cambios. `templates` guarda plantillas que Thymeleaf llena con datos en cada visita."},"errores":[{"s":"La página no cambia de aspecto","f":"Abra `localhost:8080/css/cafeteria.css`. Si sale 404, el archivo está mal ubicado o mal nombrado. Si se ve, revise la línea `\u003clink>` de `menu.html`."}]},{"id":"paso-8","corto":"El recorrido","letra":"","titulo":"Siga el recorrido de una petición","meta":"Ver cómo una petición pasa por el Controlador, el Modelo y la Vista.","minutos":20,"entienda":["Ya tiene las tres letras de MVC funcionando. Antes de seguir, vale la pena ver **en qué orden** trabajan. Use el simulador: cada clic avanza una etapa de la petición `GET /menu`."],"recorrido":true,"acciones":[{"t":"**Experimento con el depurador.** En `MenuController`, haga clic a la izquierda del número de la línea `model.addAttribute(\"platos\", menu.todos());`. Aparece un punto rojo: es un **punto de interrupción**."},{"t":"Detenga la aplicación y ejecútela en modo **Debug** (el ícono del insecto en el Spring Boot Dashboard)."},{"t":"Recargue `localhost:8080/menu`. La ejecución se detiene en su línea y el navegador queda esperando. En el panel **Variables** de VS Code observe el objeto `model`."},{"t":"Presione `F11` para **entrar** a `menu.todos()`: VS Code abre `MenuService`. Presione `F5` para continuar y mire cómo el navegador por fin recibe la página."}],"compruebe":["Recorrió las 6 etapas del simulador.","Detuvo la ejecución con el punto de interrupción y entró al servicio con `F11`."],"pregunta":{"q":"¿Qué recibe finalmente el navegador?","ops":["El archivo menu.html con los atributos th:","La lista de objetos Plato de Java","HTML normal, ya lleno con los datos","El código del controlador"],"ok":2,"exp":"Thymeleaf trabaja en el servidor. El navegador solo recibe HTML terminado: por eso con `Ctrl + U` no ve ningún `th:`."},"errores":[{"s":"El punto de interrupción no detiene nada","f":"La aplicación debe ejecutarse en modo **Debug**, no con ▶ Run. Detenga y vuelva a ejecutar con el ícono del insecto."}]},{"id":"paso-9","corto":"Detalle: @PathVariable","letra":"C","titulo":"El detalle de un plato con @PathVariable","meta":"Que cada plato tenga su propia página, por ejemplo `/menu/2`.","minutos":25,"entienda":["En `/menu/2`, el **2 es parte de la ruta**: es una [[variable de ruta]]. Se declara con llaves en la anotación, `@GetMapping(\"/menu/{id}\")`, y se recibe en el método con `@PathVariable(\"id\")`.","Sirve para identificar **un solo** recurso: el plato 2, el cliente 15, el pedido 340."],"acciones":[{"t":"Reemplace todo `MenuController.java`. Las líneas **resaltadas en verde** son las nuevas:","code":{"archivo":"MenuController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\n\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller   // CONTROLADOR: recibe la petición y elige la vista\npublic class MenuController {\n\n    private final MenuService menu;\n\n    public MenuController(MenuService menu) {   // Spring entrega el servicio\n        this.menu = menu;\n    }\n\n    // GET /menu\n    @GetMapping(\"/menu\")\n    public String verMenu(Model model) {\n        model.addAttribute(\"titulo\", \"Menú del día\");\n        model.addAttribute(\"platos\", menu.todos());\n        return \"menu\";             // VISTA: templates/menu.html\n    }\n\n    // GET /menu/2\n    @GetMapping(\"/menu/{id}\")\n    public String verPlato(@PathVariable(\"id\") Long id, Model model) {\n        model.addAttribute(\"plato\", menu.buscar(id));\n        return \"plato\";            // VISTA: templates/plato.html\n    }\n}","notas":[{"t":"Importa la anotación nueva.","line":5},{"t":"Atiende `/menu/1`, `/menu/2`… Las llaves `{id}` marcan la parte que cambia.","line":27},{"t":"Toma el valor de `{id}` de la ruta y lo convierte en número. **Escriba siempre el nombre** `(\"id\")`.","line":28},{"t":"Le pide al servicio un solo plato (la regla 3 del paso 4).","line":29},{"t":"Usa otra vista: `templates/plato.html`.","line":30}],"nuevo":[5,26,27,28,29,30,32]}},{"t":"Cree la vista `plato.html` en `templates`:","code":{"archivo":"plato.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"crear","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle th:text=\"${plato.nombre}\">Plato\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1 th:text=\"${plato.nombre}\">Nombre\u003c/h1>\n  \u003cp>Tipo: \u003cspan th:text=\"${plato.tipo}\">tipo\u003c/span>\u003c/p>\n  \u003cp>Precio: $ \u003cspan th:text=\"${#numbers.formatInteger(plato.precio, 1, 'POINT')}\">0\u003c/span>\u003c/p>\n  \u003ca th:href=\"@{/menu}\">Volver al menú\u003c/a>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Esta vista recibe **un** plato llamado `plato`, no una lista.","line":4},{"t":"Muestra el tipo del plato.","line":9},{"t":"`@{…}` construye un enlace dentro de la aplicación. Este vuelve al menú.","line":11}]}},{"t":"En `menu.html`, convierta el nombre de cada plato en un enlace a su detalle:","code":{"archivo":"menu.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"reemplazar","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle th:text=\"${titulo}\">Menú\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1 th:text=\"${titulo}\">Título\u003c/h1>\n\n  \u003cul>\n    \u003cli th:each=\"p : ${platos}\">\n      \u003ca th:href=\"@{/menu/{id}(id=${p.id})}\" th:text=\"${p.nombre}\">Plato\u003c/a>\n      · $ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\n    \u003c/li>\n  \u003c/ul>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Construye el enlace de cada plato: para el plato 2 genera `/menu/2`. `(id=${p.id})` llena el `{id}`.","line":12}],"nuevo":[12]}},{"t":"Pruebe estas direcciones: `/menu/2`, `/menu/99` y `/menu/abc`."}],"ver":{"url":"localhost:8080/menu/2","tipo":"plato","id":2,"extra":[{"url":"localhost:8080/menu/99","tipo":"whitelabel","status":404,"error":"Not Found","msg":"No existe el plato 99"},{"url":"localhost:8080/menu/abc","tipo":"whitelabel","status":400,"error":"Bad Request","msg":"Method parameter 'id': Failed to convert value of type 'java.lang.String' to required type 'java.lang.Long'"}]},"compruebe":["En `/menu`, cada nombre es un enlace que abre su detalle.","`/menu/2` muestra «Arroz con pollo» con su tipo y su precio.","`/menu/99` responde **404** con el mensaje «No existe el plato 99».","`/menu/abc` responde **400**: «abc» no se puede convertir en número."],"pregunta":{"q":"¿Quién decidió que `/menu/99` respondiera 404?","ops":["El navegador","Tomcat, porque la ruta no existe","El orElseThrow del servicio, porque no encontró el plato","Thymeleaf"],"ok":2,"exp":"La ruta `/menu/{id}` sí existe. Fue **su regla** en `MenuService.buscar` la que no encontró el plato y lanzó el [[código de estado]] 404."},"errores":[{"s":"`Name for argument of type [java.lang.Long] not specified`","f":"Escribió `@PathVariable Long id` sin el nombre. Use `@PathVariable(\"id\") Long id`."},{"s":"`Error resolving template [plato]`","f":"Falta `plato.html` en `templates` o tiene otro nombre."},{"s":"El enlace lleva a `/menu/{id}` literalmente","f":"Falta la parte `(id=${p.id})` dentro de `@{…}`."}]},{"id":"paso-10","corto":"Filtro: @RequestParam","letra":"C","titulo":"Filtrar el menú con @RequestParam","meta":"Que `/menu?tipo=bebida` muestre solo las bebidas.","minutos":20,"entienda":["En `/menu?tipo=bebida`, el dato va **después del signo `?`**: es un [[parámetro de consulta]]. Se recibe con `@RequestParam`.","Con `required = false` el parámetro es opcional: si no viene, vale `null` y mostramos todos los platos.","**Truco para diferenciarlos:** si quita el dato y la URL sigue teniendo sentido (`/menu` muestra todo), es un parámetro de consulta. Si sin el dato no se sabe qué mostrar (`/menu/` ¿cuál plato?), es una variable de ruta."],"acciones":[{"t":"Reemplace `MenuController.java` con su versión final. Cambió el método `verMenu`:","code":{"archivo":"MenuController.java","ruta":"src/main/java/co/edu/sena/adso/cafeteria/controller/","letra":"C","lang":"java","modo":"reemplazar","code":"package co.edu.sena.adso.cafeteria.controller;\n\nimport java.util.List;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.RequestParam;\n\nimport co.edu.sena.adso.cafeteria.model.Plato;\nimport co.edu.sena.adso.cafeteria.service.MenuService;\n\n@Controller   // CONTROLADOR: recibe la petición y elige la vista\npublic class MenuController {\n\n    private final MenuService menu;\n\n    public MenuController(MenuService menu) {   // Spring entrega el servicio\n        this.menu = menu;\n    }\n\n    // GET /menu   y   GET /menu?tipo=bebida\n    @GetMapping(\"/menu\")\n    public String verMenu(@RequestParam(name = \"tipo\", required = false) String tipo,\n                          Model model) {\n        List\u003cPlato> platos = (tipo == null) ? menu.todos() : menu.porTipo(tipo);\n        model.addAttribute(\"titulo\", \"Menú del día\");\n        model.addAttribute(\"platos\", platos);\n        return \"menu\";             // VISTA: templates/menu.html\n    }\n\n    // GET /menu/2\n    @GetMapping(\"/menu/{id}\")\n    public String verPlato(@PathVariable(\"id\") Long id, Model model) {\n        model.addAttribute(\"plato\", menu.buscar(id));\n        return \"plato\";            // VISTA: templates/plato.html\n    }\n}","notas":[{"t":"Necesario para declarar la variable `List\u003cPlato>`.","line":2},{"t":"Toma el valor de `?tipo=` de la URL. Si no viene, `tipo` vale `null`.","line":24},{"t":"Operador ternario: **si** no hay tipo, todos los platos; **si no**, solo los de ese tipo.","line":26},{"t":"La vista no cambia: recibe una lista llamada `platos`, completa o filtrada. Quien decide es el controlador.","line":28}],"nuevo":[2,8,10,22,24,25,26,28]}},{"t":"Pruebe en el navegador: `/menu?tipo=bebida`, `/menu?tipo=ALMUERZO` y `/menu?tipo=cena`."}],"ver":{"url":"localhost:8080/menu?tipo=bebida","tipo":"menu","estilo":true,"detalle":true,"filtros":false,"filtro":"bebida"},"compruebe":["`/menu` muestra los 5 platos.","`/menu?tipo=bebida` muestra solo 2 bebidas.","`/menu?tipo=ALMUERZO` muestra 2 almuerzos (no importan las mayúsculas).","`/menu?tipo=cena` muestra la lista vacía, sin error."],"pregunta":{"q":"¿Cuál URL usa un parámetro de consulta?","ops":["/menu/3","/menu?tipo=desayuno","/api/menu","/menu/desayuno"],"ok":1,"exp":"El parámetro de consulta va después del `?`. En `/menu/3` el 3 es una variable de ruta."},"errores":[{"s":"`Required request parameter 'tipo' … is not present`","f":"Falta `required = false`: sin él, `/menu` sin filtro deja de funcionar."},{"s":"Sale en rojo `List\u003cPlato>`","f":"Faltan `import java.util.List;` o `import co.edu.sena.adso.cafeteria.model.Plato;`."}]},{"id":"paso-11","corto":"Botones de filtro","letra":"V","titulo":"Botones de filtro en la vista","meta":"Que el usuario filtre con un clic, sin escribir la URL.","minutos":15,"entienda":["`@{…}` también construye URL con parámetros de consulta: `@{/menu(tipo='bebida')}` genera `/menu?tipo=bebida`.","`th:if` muestra una etiqueta **solo si** se cumple una condición. Lo usamos para avisar cuando un filtro no trae platos.","Los enlaces van dentro de un `\u003cp>`: por eso la regla `p a` del CSS del paso 7 los convierte en botones."],"acciones":[{"t":"Reemplace `menu.html` con su versión final:","code":{"archivo":"menu.html","ruta":"src/main/resources/templates/","letra":"V","lang":"html","modo":"reemplazar","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle th:text=\"${titulo}\">Menú\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"/css/cafeteria.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1 th:text=\"${titulo}\">Título\u003c/h1>\n\n  \u003c!-- Enlaces de filtro: @{/menu(tipo='bebida')} construye /menu?tipo=bebida -->\n  \u003cp>\n    \u003ca th:href=\"@{/menu}\">Todos\u003c/a> ·\n    \u003ca th:href=\"@{/menu(tipo='desayuno')}\">Desayunos\u003c/a> ·\n    \u003ca th:href=\"@{/menu(tipo='almuerzo')}\">Almuerzos\u003c/a> ·\n    \u003ca th:href=\"@{/menu(tipo='bebida')}\">Bebidas\u003c/a>\n  \u003c/p>\n\n  \u003cul>\n    \u003cli th:each=\"p : ${platos}\">\n      \u003ca th:href=\"@{/menu/{id}(id=${p.id})}\" th:text=\"${p.nombre}\">Plato\u003c/a>\n      · $ \u003cspan th:text=\"${#numbers.formatInteger(p.precio, 1, 'POINT')}\">0\u003c/span>\n    \u003c/li>\n  \u003c/ul>\n  \u003cp th:if=\"${#lists.isEmpty(platos)}\">No hay platos de ese tipo.\u003c/p>\n\u003c/body>\n\u003c/html>","notas":[{"t":"Enlace sin parámetro: muestra todos los platos.","line":12},{"t":"Genera `/menu?tipo=desayuno`. El texto va entre comillas simples porque ya está dentro de comillas dobles.","line":13},{"t":"El aviso solo aparece cuando la lista `platos` está vacía.","line":24}],"nuevo":[10,11,12,13,14,15,16,24]}}],"ver":{"url":"localhost:8080/menu?tipo=almuerzo","tipo":"menu","estilo":true,"detalle":true,"filtros":true,"filtro":"almuerzo","interactivo":true,"nota":"Esta vista previa funciona: haga clic en los botones de filtro y en los platos."},"compruebe":["Los botones **Todos**, **Desayunos**, **Almuerzos** y **Bebidas** filtran la lista.","Al pasar el mouse sobre un botón, la barra inferior del navegador muestra la URL que generó Thymeleaf.","`/menu?tipo=cena` muestra el aviso «No hay platos de ese tipo»."],"pregunta":{"q":"¿Qué URL genera `th:href=\"@{/menu(tipo='bebida')}\"`?","ops":["/menu/bebida","/menu?tipo=bebida","/menu(tipo=bebida)","/bebida"],"ok":1,"exp":"Lo que va entre paréntesis en `@{…}` se e menu) {\n        this.menu = menu;\n    }\n\n    @GetMapping                 // GET /api/menu\n    public List\u003cPlato> todos() {\n        return menu.todos();\n    }\n\n    @GetMapping(\"/{id}\")        // GET /api/menu/2\n    public Plato uno(@PathVariable(\"id\") Long id) {\n        return menu.buscar(id);\n    }\n}","notas":[{"t":"«Respondo datos, no páginas».","line":12},{"t":"Prefijo para todos los métodos de la clase: todos empiezan por `/api/menu`.","line":13},{"t":"Spring inyecta el **mismo** bean `MenuService` que usa `MenuController`.","line":16},{"t":"Sin ruta propia: atiende exactamente `GET /api/menu`.","line":22},{"t":"Devuelve la lista y Spring la convierte en JSON. No hay `Model` ni vista.","line":24},{"t":"Atiende `GET /api/menu/2`. Se suma al prefijo de la clase.","line":27}]}},{"t":"Abra en el navegador `localhost:8080/api/menu` y `localhost:8080/api/menu/2`."},{"t":"En una terminal nueva compare las dos respuestas con `curl -i` (la `-i` muestra los encabezados):","code":{"archivo":"Terminal","lang":"sh","modo":"terminal","code":"curl -i http://localhost:8080/menu/2\ncurl -i http://localhost:8080/api/menu/2","notas":[{"t":"Busque la línea `Content-Type`: la página dice `text/html` y la API `application/json`.","line":1}]}}],"ver":{"url":"localhost:8080/api/menu","tipo":"json"},"compruebe":["`/api/menu` muestra los 5 platos en JSON.","`/api/menu/2` muestra solo el arroz con pollo.","Con `curl -i`, la página responde `Content-Type: text/html` y la API `application/json`.","`/api/menu/99` responde el error 404 en JSON, no como página."],"pregunta":{"q":"Si agrega un sexto plato en `MenuService`, ¿dónde aparece?","ops":["Solo en la página /menu","Solo en la API /api/menu","En la página y en la API, sin tocar nada más","En ninguna hasta modificar los dos controladores"],"ok":2,"exp":"Los dos controladores usan el mismo servicio. Pruébelo: agregue un plato, guarde y revise `/menu` y `/api/menu`."},"errores":[{"s":"El navegador muestra la palabra « --texto: #2b2b2b;\n}\n\nbody {\n  max-width: 720px;\n  margin: 0 auto;\n  padding: 24px 16px;\n  font-family: Arial, Helvetica, sans-serif;\n  background: var(--coco);\n  color: var(--texto);\n}\n\nh1 {\n  color: var(--mar);\n  border-bottom: 4px solid var(--corozo);\n  padding-bottom: 8px;\n}\n\na {\n  color: var(--mar);\n  font-weight: bold;\n}\n\n/* Los enlaces de filtro (están dentro de un párrafo) */\np a {\n  display: inline-block;\n  background: var(--mar);\n  color: white;\n  padding: 4px 12px;\n  border-radius: 16px;\n  text-decoration: none;\n}\n\nul {\n  list-style: none;\n  padding: 0;\n}\n\n/* Cada plato del menú */\nli {\n  background: white;\n  margin-bottom: 10px;\n  padding: 12px 16px;\n  border-left: 6px solid var(--corozo);\n  border-radius: 8px;\n  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);\n}"};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n.toLocaleString('es-CO').replace(/,/g, '.');

// mini-markdown: **negrita**, `código`, *cursiva*, [[término|texto]]
function md(t, plain) {
  let h = esc(t);
  h = h.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  h = h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, k, l) => plain ? `<b>${l || k}</b>` : `<button type="button" class="term" data-t="${k}">${l || k}</button>`);
  return h;
}

// ---------- resaltado de código ----------
const RX = {
  java: [/(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@\w+)|\b(package|import|public|private|final|class|record|return|new|static|void|null|int|this|if|else)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b(\d+L?)\b/g, ['com', 'str', 'ann', 'kw', 'typ', 'num']],
  html: [/(<!--.*?-->)|(<\/?[a-zA-Z][\w-]*|\/?>)|(th:[\w-]+|xmlns:th)(?==)|([a-zA-Z-]+)(?==)|("[^"]*")/g, ['com', 'tag', 'th', 'attr', 'str']],
  css: [/(\/\*.*?\*\/)|(--[\w-]+)|^(\s+[a-z-]+)(?=\s*:)|(#[0-9a-fA-F]{3,6}\b)/g, ['com', 'var', 'prop', 'num']],
  props: [/^([\w.-]+)(?==)|(=.*$)/g, ['attr', 'str']],
  sh: [/(#.*$)|^(\.\/mvnw|[a-z]+)(?=\s|$)/g, ['com', 'cmd']],
  tree: [/(←.*$)|(\s[MVC]\s\s)/g, ['com', 'ann']],
};
function hl(line, lang) {
  if (lang === 'css' && /^[^\s].*\{\s*$/.test(line)) return '<span class="t-sel">' + esc(line.replace(/\{\s*$/, '')) + '</span>{';
  const r = RX[lang]; if (!r) return esc(line);
  const [rx, cls] = r; rx.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = rx.exec(line))) {
    if (m[0] === '') { rx.lastIndex++; continue; }
    const gi = m.slice(1).findIndex(x => x !== undefined);
    out += esc(line.slice(last, m.index)) + `<span class="t-${cls[gi]}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(line.slice(last));
}

const MODE = { crear: 'Archivo nuevo', reemplazar: 'Reemplace todo', terminal: 'Terminal', ref: 'Referencia' };
let codeSeq = 0;
function codeBlock(c) {
  const id = 'cb' + (codeSeq++);
  const lines = c.code.split('\n');
  const pinAt = {}; (c.notas || []).forEach((n, i) => { if (n.line >= 0 && pinAt[n.line] === undefined) pinAt[n.line] = i + 1; });
  const nuevo = new Set(c.nuevo || []);
  const rows = lines.map((l, i) => `<div class="ln${nuevo.has(i) ? ' new' : ''}" data-l="${i}"><span class="no">${pinAt[i] ? `<span class="pin">${pinAt[i]}</span>` : ''}${c.modo === 'terminal' || c.modo === 'ref' ? '' : i + 1}</span><span class="tx">${hl(l, c.lang) || ' '}</span></div>`).join('');
  const letter = c.letra ? `<span class="letter ${c.letra}">${c.letra}</span>` : '';
  const notes = (c.notas || []).length ? `<p class="notes-title">Línea por línea · toque una nota para ubicarla</p><ol class="notes">${c.notas.map((n, i) => `<li><button type="button" data-cb="${id}" data-l="${n.line}"><span class="pinx">${i + 1}</span><span>${md(n.t, true)}</span></button></li>`).join('')}</ol>` : '';
  return `<div class="code" id="${id}">
    <div class="code-head">${letter}<span class="fname">${esc(c.archivo)}</span><span class="mode ${c.modo}">${MODE[c.modo] || ''}</span>
      ${c.modo !== 'ref' ? `<button type="button" class="copy" data-copy="${id}" title="Intente escribirlo usted; copie solo si se atasca">Copiar</button>` : ''}
      ${c.ruta ? `<span class="fpath">${esc(c.ruta)}${esc(c.archivo)}</span>` : ''}</div>
    <pre>${rows}</pre>${nuevo.size ? '<div class="legend"><span><i></i>Líneas nuevas o que cambiaron</span></div>' : ''}
  </div>${notes}`;
  // nota: el código queda en DATA para copiarlo sin perder espacios
}

function scopedCss(styled) {
  const base = ':host{display:block} .body{font-family:"Times New Roman",serif;color:#000;background:#fff;padding:8px 16px;min-height:140px} a{color:#0000ee}';
  if (!styled) return base;
  return base + css.replace(/:root/g, ':host').replace(/(^|\n)body\s*\{/g, '$1.body {');
}
function menuHtml(o) {
  const list = o.filtro ? platos.filter(p => p.tipo === o.filtro) : platos;
  const name = p => o.detalle ? `<a href="#" data-plato="${p.id}">${esc(p.nombre)}</a>` : `<span>${esc(p.nombre)}</span>`;
  const filtros = o.filtros ? `<p><a href="#" data-f="">Todos</a> · <a href="#" data-f="desayuno">Desayunos</a> · <a href="#" data-f="almuerzo">Almuerzos</a> · <a href="#" data-f="bebida">Bebidas</a></p>` : '';
  return `<div class="body"><h1>Menú del día</h1>${filtros}<ul>${list.map(p => `<li>${name(p)} · $ <span>${fmt(p.precio)}</span></li>`).join('')}</ul>${o.filtros && !list.length ? '<p>No hay platos de ese tipo.</p>' : ''}</div>`;
}
function platoHtml(id, interactivo) {
  const p = platos.find(x => x.id === id);
  return `<div class="body"><h1>${esc(p.nombre)}</h1><p>Tipo: <span>${p.tipo}</span></p><p>Precio: $ <span>${fmt(p.precio)}</span></p><a href="#" data-back="1">Volver al menú</a></div>`;
}
function whitelabel(v) {
  const d = new Date();
  return `<div class="body" style="font-family:Arial,sans-serif"><h1 style="font-size:1.6em;margin:.4em 0">Whitelabel Error Page</h1><p>This application has no explicit mapping for /error, so you are seeing this as a fallback.</p><div>${d.toString().slice(0, 24)}</div><div>There was an unexpected error (type=${esc(v.error)}, status=${v.status}).</div><div>${esc(v.msg)}</div></div>`;
}
function jsonHtml() {
  const s = JSON.stringify(platos, null, 2);
  return '<pre class="json">' + esc(s).replace(/(&quot;\w+&quot;)(:)/g, '<span class="k">$1</span>$2').replace(/: (&quot;[^&]*&quot;)/g, ': <span class="s">$1</span>').replace(/: (\d+)/g, ': <span class="n">$1</span>') + '</pre>';
}
function mountBrowser(el, views) {
  let cur = 0, state = null;
  const tabs = views.length > 1 ? `<div class="btabs" role="group" aria-label="Direcciones para probar">${views.map((v, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${esc(v.url.replace('localhost:8080', ''))}</button>`).join('')}</div>` : '';
  el.innerHTML = `<div class="browser"><div class="bbar"><span class="dots"><i></i><i></i><i></i></span><span class="url"></span></div><div class="bview"></div></div>${tabs ? '<div style="margin-top:8px">' + tabs + '</div>' : ''}`;
  const view = $('.bview', el), url = $('.url', el);
  const host = document.createElement('div'); view.appendChild(host);
  const root = host.attachShadow({ mode: 'open' });
  function render() {
    const v = views[cur];
    if (v.tipo === 'json') { url.textContent = v.url; host.hidden = true; view.querySelector('.json')?.remove(); view.insertAdjacentHTML('beforeend', jsonHtml()); return; }
    host.hidden = false; view.querySelector('.json')?.remove();
    let body, u = v.url, styled = v.estilo !== false;
    if (v.tipo === 'whitelabel') { body = whitelabel(v); styled = false; }
    else if (v.tipo === 'plato' || (state && state.plato)) { const id = state && state.plato || v.id; body = platoHtml(id); u = 'localhost:8080/menu/' + id; styled = true; }
    else { const f = state ? state.f : v.filtro; body = menuHtml({ ...v, filtro: f }); u = 'localhost:8080/menu' + (f ? '?tipo=' + f : ''); }
    url.textContent = u;
    root.innerHTML = `<style>${scopedCss(styled)}</style>${body}`;
  }
  root.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return; e.preventDefault();
    const v = views[cur]; if (!v.interactivo && !(v.tipo === 'plato')) return;
    if (!v.interactivo) return;
    state = state || { f: v.filtro, plato: null };
    if (a.dataset.f !== undefined) { state.f = a.dataset.f; state.plato = null; }
    else if (a.dataset.plato) state.plato = +a.dataset.plato;
    else if (a.dataset.back) state.plato = null;
    render();
  });
  el.addEventListener('click', e => { const b = e.target.closest('.btabs button'); if (!b) return; cur = +b.dataset.i; state = null; el.querySelectorAll('.btabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  render();
}

// ---------- recorrido ----------
const ETAPAS = [
  { n: [0], t: 'Usted escribe `localhost:8080/menu` y presiona Enter. El navegador envía la petición **GET /menu** al servidor.', c: 'GET /menu' },
  { n: [1], t: 'Tomcat recibe la petición y Spring busca un método con `@GetMapping("/menu")`. Lo encuentra en `MenuController.verMenu`.', c: 'GET /menu' },
  { n: [1, 2], t: 'El controlador no tiene los platos: se los pide a la cocina con `menu.todos()`.', c: 'menu.todos()' },
  { n: [2, 1], t: 'El servicio devuelve la lista con los cinco platos (objetos `Plato`).', c: 'List<Plato> · 5 platos' },
  { n: [1, 3], t: 'El controlador pone `titulo` y `platos` en la bandeja (`Model`) y devuelve el nombre de la vista: `"menu"`.', c: 'Model { titulo, platos } + "menu"' },
  { n: [3, 0], t: 'Thymeleaf llena `menu.html` con los datos y Spring envía **HTML terminado** al navegador. Después el navegador pide `/css/cafeteria.css` a la carpeta `static`.', c: 'HTML del menú' },
];
const NODOS = [['', 'Navegador', 'localhost:8080'], ['C', 'Controlador', 'MenuController'], ['M', 'Modelo', 'MenuService'], ['V', 'Vista', 'menu.html'], ['', 'Archivos fijos', 'static/css']];
function mountSim(el) {
  let i = S.sim > 0 ? Math.min(S.sim, ETAPAS.length) - 1 : -1;
  el.innerHTML = `<div class="sim"><div class="lanes">${NODOS.map(([l, a, b], k) => `<div class="node" data-k="${k}">${l ? `<span class="letter ${l}">${l}</span> ` : ''}${a}<b>${b}</b></div>`).join('')}</div>
    <div class="stage" aria-live="polite"></div>
    <div class="simnav"><button type="button" class="btn ghost" data-s="-1">Etapa anterior</button><button type="button" class="btn primary" data-s="1">Etapa siguiente</button><span class="pips">${ETAPAS.map(() => '<i></i>').join('')}</span></div></div>`;
  function draw() {
    const e = ETAPAS[i];
    el.querySelectorAll('.node').forEach(n => n.classList.toggle('on', !!e && (e.n.includes(+n.dataset.k) || (i === 5 && +n.dataset.k === 4))));
    el.querySelectorAll('.pips i').forEach((p, k) => p.classList.toggle('on', k <= i));
    $('.stage', el).innerHTML = e ? `<p><b>Etapa ${i + 1} de ${ETAPAS.length}.</b> ${md(e.t)}</p><span class="cargo">Viaja: ${esc(e.c)}</span>` : `<p>Presione <b>Etapa siguiente</b> para enviar la petición <code>GET /menu</code>.</p>`;
    $('[data-s="-1"]', el).disabled = i < 0;
    $('[data-s="1"]', el).disabled = i >= ETAPAS.length - 1;
  }
  el.addEventListener('click', ev => { const b = ev.target.closest('[data-s]'); if (!b) return; i = Math.max(-1, Math.min(ETAPAS.length - 1, i + +b.dataset.s)); S.sim = Math.max(S.sim, i + 1); save(); draw(); });
  draw();
}

// ---------- ruta ----------
const IDS = ['inicio', ...pasos.map(p => p.id), 'cierre'];
const doneCount = () => pasos.filter(p => S.done[p.id]).length;
function unlocked(id) {
  if (id === 'inicio') return true;
  if (id === 'cierre') return pasos.every(p => S.done[p.id]);
  const k = pasos.findIndex(p => p.id === id);
  return k === 0 || !!S.done[pasos[k - 1].id];
}
function frontier() { const p = pasos.find(p => !S.done[p.id]); return p ? p.id : 'cierre'; }
function renderRoute(cur) {
  const items = [['inicio', 'Antes de empezar', '', '·'], ...pasos.map((p, k) => [p.id, p.corto, p.letra, k]), ['cierre', 'Cierre y certificado', '', '★']];
  $('#routeList').innerHTML = items.map(([id, t, l, n]) => {
    const done = S.done[id] || (id === 'inicio' && S.started) || (id === 'cierre' && S.certified);
    return `<li><button type="button" class="ritem${done ? ' done' : ''}" data-go="${id}" ${unlocked(id) ? '' : 'disabled'} ${id === cur ? 'aria-current="page"' : ''}><span class="rnum">${done ? '✓' : n}</span><span class="rtxt">${esc(t)}</span>${l ? `<span class="letter ${l}">${l}</span>` : '<span></span>'}</button></li>`;
  }).join('');
  $('#routeSelect').innerHTML = items.map(([id, t, , n]) => `<option value="${id}" ${id === cur ? 'selected' : ''} ${unlocked(id) ? '' : 'disabled'}>${typeof n === 'number' ? 'Paso ' + n + ' · ' : ''}${esc(t)}${S.done[id] ? ' ✓' : ''}</option>`).join('');
  const d = doneCount();
  $('#meterFill').style.width = (d / pasos.length * 100) + '%';
  $('#meterTxt').textContent = `${d} de ${pasos.length} pasos`;
}

// ---------- vistas ----------
function viewInicio() {
  const f = frontier();
  const fl = f === 'cierre' ? 'Ir al cierre' : (S.started ? 'Continuar en el paso ' + f.split('-')[1] : 'Empezar el paso 0');
  return `<div class="view">
  <header class="hero"><div class="eyebrow">Ejemplo 2 · después de Rincones de Cartagena</div>
    <h2>Construya usted mismo el menú de la cafetería</h2>
    <p>En Rincones de Cartagena hizo su primera página con un controlador y una plantilla. Ahora va a construir, **solo y paso a paso**, una aplicación completa con las tres partes del patrón MVC. Al final tendrá el sitio de la cafetería funcionando en su máquina.</p></header>
  <section class="block"><h3>Lo que va a tener funcionando</h3>
    <div class="cards">
      <div class="card"><code>/menu</code><p>La carta del día con los cinco platos y su precio.</p></div>
      <div class="card"><code>/menu/2</code><p>La página de un plato, con su tipo y su precio.</p></div>
      <div class="card"><code>/menu?tipo=bebida</code><p>Botones para filtrar desayunos, almuerzos o bebidas.</p></div>
      <div class="card"><code>/api/menu</code><p>Los mismos platos en JSON, para una app de domicilios.</p></div>
    </div>
    <div id="heroBrowser"></div>

  </section>
  <section class="block"><h3>Los archivos que va a escribir</h3>
    <div class="files">
      ${[['M', 'Plato.java', 'Los datos de un plato', 'Paso 3'], ['M', 'MenuService.java', 'La lista de platos y las reglas para consultarlos', 'Paso 4'], ['C', 'MenuController.java', 'Atiende las páginas: menú, detalle y filtro', 'Pasos 5, 9 y 10'], ['V', 'menu.html', 'La página del menú', 'Pasos 6, 7, 9 y 11'], ['V', 'plato.html', 'La página de un plato', 'Paso 9'], ['', 'cafeteria.css', 'Los colores de la cafetería', 'Paso 7'], ['C', 'MenuApiController.java', 'Responde los platos en JSON', 'Paso 12']]
      .map(([l, f, d, p]) => `<div class="file">${l ? `<span class="letter ${l}">${l}</span>` : '<span></span>'}<span><code>${f}</code> <span class="d">${d}</span></span><small>${p}</small></div>`).join('')}
    </div>
    <p class="bnote"><span class="letter M">M</span> Modelo · <span class="letter V">V</span> Vista · <span class="letter C">C</span> Controlador</p>
  </section>
  <section class="block"><h3>Cómo funciona esta ruta</h3>
    <div class="cards">
      <div class="card"><b>Un paso a la vez</b><p>Cada paso explica primero el concepto y después le dice qué hacer y dónde.</p></div>
      <div class="card"><b>Código con notas</b><p>Toque una nota y se ilumina la línea que explica. Lo nuevo aparece en verde.</p></div>
      <div class="card"><b>Compruebe y responda</b><p>Para pasar al siguiente paso, marque lo que ya le funciona y responda una pregunta.</p></div>
      <div class="card"><b>¿No funciona?</b><p>Cada paso trae los errores más comunes y cómo resolverlos.</p></div>
    </div>
    <div class="analogy">Escriba el código usted mismo en lugar de copiarlo: así se aprende. Use el botón <b>Copiar</b> solo si se atasca. Su avance se guarda en este navegador.</div>
  </section>
  <section class="block"><h3>¿Quién hace la ruta?</h3>
